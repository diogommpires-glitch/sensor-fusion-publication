[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "sensor-fusion-lab"
version = "0.2.0"
description = "Reproducible 3D positioning, sensor-fusion experiments and an interactive local laboratory"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
  "numpy>=2.3,<3", "scipy>=1.16,<2", "scikit-learn>=1.7,<2",
  "pydantic>=2.12,<3", "h5py>=3.14,<4", "matplotlib>=3.10,<4",
  "fastapi>=0.120,<1", "uvicorn>=0.38,<1", "filelock>=3.20,<4", "psutil>=7,<8",
]

[project.optional-dependencies]
hardware = ["pyserial==3.5"]
dev = [
  "pytest>=9,<10", "pytest-cov>=7,<8", "httpx>=0.28,<1",
  "ruff>=0.14,<1", "mypy>=1.18,<3", "build>=1.3,<2", "hatchling>=1.28,<2",
  "editables>=0.5,<1",
]

[project.scripts]
sensorfusion = "sensorfusion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorfusion"]
artifacts = ["src/sensorfusion/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "frontend", "docs", "protocols", "releases", "README.md", "LICENSE", "AGENTS.md", "CLAUDE.md", "IMPLEMENTATION_PLAN.md", "RESEARCH_UPGRADE_PLAN.md", "pyproject.toml", "requirements-lock.txt", "Start-Lab.cmd"]
exclude = ["frontend/node_modules", "frontend/dist", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = ["SIM", "FURB", "PERF", "C4", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
