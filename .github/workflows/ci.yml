name: quality

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create project environment
        run: |
          python -m venv .venv
          python - <<'PY'
          import os
          from pathlib import Path
          binaries = Path('.venv') / ('Scripts' if os.name == 'nt' else 'bin')
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              output.write(f'{binaries.resolve()}\n')
          PY
      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check Python format, lint and types
        run: |
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src tests
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend types and lint
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
      - name: Build packaged frontend
        run: python scripts/build_frontend.py
      - name: Run fixture and contract tests
        run: |
          mkdir -p tmp
          python -m pytest --cov=sensorfusion --cov-report=term-missing --basetemp tmp/pytest-ci --ignore=tests/test_history_v2.py --ignore=tests/test_investigation.py --ignore=tests/test_research_api.py
